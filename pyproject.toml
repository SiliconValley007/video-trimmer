[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "video-trimmer"
version = "1.2.0"
description = "Cross-platform GUI to cut multiple video segments and export them as one file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyQt6>=6.5", "ffmpeg-python>=0.2.0"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
build = ["pyinstaller>=6.0"]

[project.gui-scripts]
video-trimmer = "video_trimmer.__main__:main"

[tool.setuptools]
packages = ["video_trimmer"]

[tool.setuptools.package-data]
video_trimmer = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
