name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: pip install -r requirements.txt pyinstaller
      - run: pytest -q
      - run: pyinstaller packaging/video-trimmer.spec --noconfirm
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory release, bundle | Out-Null
          Copy-Item dist/VideoTrimmer.exe release/VideoTrimmer-windows-x64.exe
          $ff = Split-Path (Get-Command ffmpeg).Source
          Copy-Item dist/VideoTrimmer.exe, "$ff/ffmpeg.exe", "$ff/ffprobe.exe", LICENSE bundle/
          Compress-Archive -Path bundle/* -DestinationPath release/VideoTrimmer-windows-x64-with-ffmpeg.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VideoTrimmer-windows
          path: release/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
